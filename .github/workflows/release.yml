name: Release

on:
  workflow_run:
    workflows: ["Version Bump"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.3.0). Created from main if it does not exist yet'
        required: true
        type: string

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 0

    - name: Resolve release ref (creating the tag if needed)
      id: resolve
      env:
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_TAG: ${{ inputs.tag }}
      run: |
        # Automatic runs (after Version Bump) always build main
        if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
          echo "ref=main" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        TAG="$DISPATCH_TAG"
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "Error: tag '$TAG' must look like vX.Y.Z or vX.Y.Z-suffix"
          exit 1
        fi

        if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, building it as-is"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Tag $TAG does not exist, creating it from main"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Mirror the Version Bump workflow so the tagged commit carries the right version
        VERSION="${TAG#v}"
        sed -i "s/Version:     \"[^\"]*\"/Version:     \"$VERSION\"/" cmd/steam/main.go
        if ! git diff --quiet cmd/steam/main.go; then
          git add cmd/steam/main.go
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main
        fi

        git tag -a "$TAG" -m "Release $TAG"
        git push origin "refs/tags/$TAG"
        echo "ref=$TAG" >> "$GITHUB_OUTPUT"

  # Reusable workflow builds linux-amd64, linux-arm64 and windows-amd64 and
  # uploads the matrix-steam-bridge-* artifacts used by the jobs below.
  build-binaries:
    name: Build binaries
    needs: prepare
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      arches: '["amd64","arm64"]'
      windows: true
    permissions:
      contents: read

  resolve-tag:
    name: Resolve tag to release
    runs-on: ubuntu-latest
    # A workflow_dispatch run needs the tag created by `prepare` first
    needs: prepare
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      prerelease: ${{ steps.get_tag.outputs.prerelease }}
      version: ${{ steps.get_tag.outputs.version }}
      docker_tags: ${{ steps.get_tag.outputs.docker_tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 0

    - name: Get tag to release
      id: get_tag
      env:
        DISPATCH_TAG: ${{ inputs.tag }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="$DISPATCH_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: tag '$TAG' must look like vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Error: tag $TAG does not exist in this repository"
            exit 1
          fi
          echo "Using manually dispatched tag: $TAG"
        else
          # Get the tag that points to the head commit of the triggering workflow
          TAG=$(git describe --tags --exact-match "$HEAD_SHA" 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "Error: No tag found for commit $HEAD_SHA"
            exit 1
          fi
          echo "Found tag: $TAG for commit $HEAD_SHA"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Detect pre-release tags (e.g. v1.2.0-beta.1, v1.2.0-rc.1, v1.2.0-alpha.1)
        PRERELEASE=false
        if echo "$TAG" | grep -qE '\-(alpha|beta|rc)([0-9]+)?(\.[0-9]+)?$'; then
          PRERELEASE=true
          echo "prerelease=true" >> $GITHUB_OUTPUT
          echo "Detected pre-release tag"
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

        # Docker tags: the plain version always, plus `latest` for non-prereleases
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        {
          echo "docker_tags<<DOCKER_TAGS"
          echo "$VERSION"
          if [ "$PRERELEASE" = "false" ]; then
            echo "latest"
          fi
          echo "DOCKER_TAGS"
        } >> "$GITHUB_OUTPUT"

  create-release:
    name: Create release
    # No checkout needed: the tag already exists on the remote and the
    # binaries come from build-binaries as workflow artifacts.
    needs: [resolve-tag, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.resolve-tag.outputs.tag }}
        draft: false
        prerelease: ${{ needs.resolve-tag.outputs.prerelease }}
        generate_release_notes: true
        files: ./artifacts/*/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image is packaged from the exact release binaries (no recompilation).
  # Prereleases do not move the `latest` tag.
  docker-image:
    name: Build and push Docker image
    needs: [prepare, resolve-tag, build-binaries]
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      arches: '["amd64","arm64"]'
      push: true
      tags: ${{ needs.resolve-tag.outputs.docker_tags }}
      version: ${{ needs.resolve-tag.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
