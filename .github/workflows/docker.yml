# Build and Push Docker Images.
#
# Flow: `meta` decides the tags/architectures, `binaries` compiles the Go
# bridge and SteamKit.Service per architecture in the reusable build-binaries
# workflow (artifacts `matrix-steam-bridge-linux-<arch>`), and `image` hands
# those artifacts to the reusable docker-image workflow, which unpacks them
# into ./docker-bin and packages them into the image. Nothing is compiled
# inside Docker any more. Pull requests validate on amd64 only and never push.

name: Build and Push Docker Images

on:
  # Releases are cut by release.yml, which owns the release artefacts, so the
  # old workflow_run trigger on "Version Bump" is gone.
  push:
    branches: [ main ]
    # Only files that end up in (or change) the image. docker-compose.yml,
    # build.sh and generate-protos.sh are deliberately absent: they do not
    # affect the image, so leaving them out avoids pointless image builds.
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'SteamBridge/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/build-binaries.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'SteamBridge/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

# Allow only one image pipeline per PR/branch and cancel superseded runs.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  meta:
    name: Decide tags and architectures
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
      arches: ${{ steps.plan.outputs.arches }}

    steps:
    - name: Plan tags and architectures
      id: plan
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # A pull request only validates the image: single architecture and
          # no tags, so docker-image.yml builds a throwaway :test-<arch> tag
          # and loads it locally instead of pushing.
          echo 'arches=["amd64"]' >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Everything that gets pushed is built for both architectures.
        echo 'arches=["amd64","arm64"]' >> "$GITHUB_OUTPUT"

        TAGS="sha-$(printf '%s' "$SHA" | cut -c1-7)"
        if [ "$REF_NAME" = "main" ]; then
          TAGS="${TAGS}"$'\n'"main"$'\n'"latest"
        else
          # workflow_dispatch from a feature branch: roll a per-branch tag.
          TAGS="$(printf '%s' "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
        fi

        {
          echo 'tags<<EOF'
          printf '%s\n' "$TAGS"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

  binaries:
    name: Compile binaries
    needs: meta
    # Compilation happens on plain runners, the image only packages the result.
    # windows: false because a Docker image for Linux never needs the .exe.
    uses: ./.github/workflows/build-binaries.yml
    with:
      arches: ${{ needs.meta.outputs.arches }}
      windows: false
    permissions:
      contents: read

  image:
    name: Package and push Docker image
    needs: [ meta, binaries ]
    # Reusable workflow that unpacks the artifacts into ./docker-bin, builds
    # one image per architecture and merges them into a manifest list.
    uses: ./.github/workflows/docker-image.yml
    with:
      arches: ${{ needs.meta.outputs.arches }}
      # Pull requests only validate the image; pushes publish it.
      push: ${{ github.event_name != 'pull_request' }}
      tags: ${{ needs.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      security-events: write

